# 人工校对，导出时按顺序套用。
# match：按 id，或 kind + from + to [+ announced]；action：confirm | delete | set | supersede | merge
#   confirm  — 认定为真并计入（也用于把被聚类误判为重复的边救回）
#   delete   — 不显示
#   set      — 改字段（fields: amount_usd / status / announced / from_entity / to_entity / kind / title_zh …）
#   supersede— 被 by 指向的边取代（旧边标 cancelled，不计入）
#   merge    — 并入 into 指向的边（来源合并）
overrides:
  # Anthropic–博通 630 亿美元芯片融资：结构是 SPV 向银团借款、买博通芯片租给 Anthropic。
  # 借款人改成 SPV；BofA 单独那条并进来；Anthropic→SPV 的租赁作为独立的一笔保留。
  - {match: {id: 33}, action: set, fields: {from_entity: ANTHROPIC_XPU_SPV, title_zh: "SPV 向 BofA/花旗/大摩/黑石借 630 亿美元买博通芯片租给 Anthropic"}, note: "借款人是 SPV 而非 Anthropic"}
  - {match: {id: 48}, action: merge, into: 33, note: "同一笔 SPV 贷款"}
  - {match: {id: 47}, action: confirm, note: "租赁侧：Anthropic 向 SPV 租用芯片，与 SPV 的贷款是两笔承诺"}
