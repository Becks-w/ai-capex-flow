      - {url: "https://investors.terawulf.com/news-events/press-releases/detail/142/", title: "TeraWulf Announces Anthropic Lease at Justified Data Campus and Sale of Majority Interest in Abernathy Joint Venture to Fluidstack", publisher: "TeraWulf (press release)", date: "2026-07-06", tier: 2, quote: "The lease is expected to generate approximately $19 billion of contracted lease revenue over the initial term"}
