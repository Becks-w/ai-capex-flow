# CoreWeave 可转债补录（2026-10-28）：两笔完成公告挂在 8-K 第 1.01 / 3.02 项下而非 2.03 项，历史回填的项目筛选漏掉，按一手文件补入。2026-04 的 40 亿 1.75% 可转债（2032 到期）已在库中（#274），为第三笔，不在此文件。
